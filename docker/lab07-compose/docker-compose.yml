services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - app-net

  php:
    build:
      context: ./php-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./php-app:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php-app:/var/www/html:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app-net

  # Démarrage optionnel : docker compose --profile debug up -d
  debug:
    image: alpine:3.20
    profiles: ["debug"]
    command: ["sleep", "infinity"]
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
    driver: bridge
