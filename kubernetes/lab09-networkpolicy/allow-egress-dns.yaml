# Étape 4 (optionnelle) : ré-autorise DNS (CoreDNS) + TCP vers le backend.
# Les règles Egress de toutes les NetworkPolicy qui sélectionnent le pod
# sont unies (union) : cette policy suffit même si deny-egress est encore là.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  labels:
    app.kubernetes.io/name: allow-egress-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              role: backend
      ports:
        - protocol: TCP
          port: 8080
