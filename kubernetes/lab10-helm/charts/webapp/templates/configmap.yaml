# yamllint disable-file
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <title>{{ .Values.message }}</title>
    </head>
    <body>
      <h1>{{ .Values.message }}</h1>
    </body>
    </html>
