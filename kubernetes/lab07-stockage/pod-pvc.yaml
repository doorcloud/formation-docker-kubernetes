apiVersion: v1
kind: Pod
metadata:
  name: persistant
  labels:
    app.kubernetes.io/name: persistant
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  # Sur certains CSI (ex. Trident sur DKS, PV sans fsType), le kubelet n'applique pas fsGroup :
  # le volume reste root:root et le conteneur non-root ne peut pas ecrire. On rend le dossier
  # au bon utilisateur une fois, avec un initContainer root (voir README, section Pieges).
  initContainers:
    - name: chown-data
      image: ghcr.io/doorcloud/formation/busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "chown 65534:65534 /data && chmod 0775 /data"]
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "FOWNER"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: donnees
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  containers:
    - name: writer
      image: ghcr.io/doorcloud/formation/busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: donnees
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: donnees
