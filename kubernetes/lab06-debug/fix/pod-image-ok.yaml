apiVersion: v1
kind: Pod
metadata:
  name: image-introuvable
  labels:
    app.kubernetes.io/name: image-introuvable
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      imagePullPolicy: Always
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
