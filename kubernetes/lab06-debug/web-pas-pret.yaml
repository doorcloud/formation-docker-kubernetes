apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-pas-pret
  labels:
    app.kubernetes.io/name: web-pas-pret
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-pas-pret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-pas-pret
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              # Chemin volontairement faux : le processus tourne, le Pod n'est jamais Ready.
              path: /sante-introuvable
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-pas-pret
  labels:
    app.kubernetes.io/name: web-pas-pret
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-pas-pret
  ports:
    - name: http
      port: 80
      targetPort: http
